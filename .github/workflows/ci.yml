name: CloudForge CI

on:
  push:
    branches:
    - main
    - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Validate Python syntax
        run: python -m compileall backend/app

      - name: Run backend tests
        working-directory: backend
        run: |
         if find tests -type f -name "test_*.py" 2>/dev/null | grep -q .; then
          python -m pytest -v
         else
          echo "No backend tests found - skipping pytest."
         fi
    frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-validation
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build backend Docker image
        run: docker build -t cloudforge-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t cloudforge-frontend:ci ./frontend
